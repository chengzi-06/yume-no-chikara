<script id="lesson-data" type="application/json">{"title": "夢の力", "translation": "梦想的力量", "prompt": "每个人都有自己的梦想，梦想不分大小，它都能给我们带来勇往直前的力量。请以『夢の力』为题，写一篇作文。", "section": "日语大作文 · 课堂带练", "source_note": "题目、两项要点及字数文体要求来自用户“照片1.jpg”。未提供配套范文；本课例文是模型为课堂构拟的情境，不是用户真实经历、官方范文或得分承诺。 本轮按用户建议将泛化考试受挫例子替换为持续学习、休息时间给同学讲题、自己理解与成绩改善的实践。", "essay_origin": "generated", "essay_label": "教学生成范文", "requirements": {"min_chars": 280, "max_chars": 320, "style": "polite", "source": "用户照片：280～320字；格式正确，书写清楚；です、ます体。"}, "points": [{"title": "简单介绍你的梦想", "label": "要点 1", "detail": "先说清你想成为什么样的人、想做到什么事。梦想可以是职业、学习、技能或个人生活中的愿望；题干说不分大小，不把职业地位当作优劣标准。", "points": ["明示要求是简单介绍，不必写完整人生规划。", "可补与自己兴趣或经历有关的一句理由，理由不是额外硬性要点。", "让梦想在后面的事例里起作用，不只是开头出现一次。"], "angles": [{"title": "想从事的工作或想帮助的人", "questions": "你想做什么？为什么愿意做？现在能怎样准备？", "path": "梦想 → 自己的缘由 → 当前准备", "example": "可先写「将来、先生になりたいです。」也可换成自己会说的职业。"}, {"title": "想学会的一项能力", "questions": "最想学会什么？哪一点吸引你？现在的起点怎样？", "path": "能力愿望 → 意义 → 目前起点", "example": "可选运动或学习技能；表达从「上手に泳ぎたいです。」等简句起步。"}, {"title": "想继续学习的方向", "questions": "想在哪类领域学习？希望怎样成长？为什么对自己重要？", "path": "想学习的方向 → 自己的理由", "example": "可从「将来、大学で勉強したいです。」起步，不编造录取或获奖经历。"}]}, {"title": "以具体事例，说明梦想带给你的力量", "label": "要点 2", "detail": "选一件与梦想本身紧密相关的行动，说明梦想怎样让自己更主动学习、练习或帮助别人。“学习成绩提高”应由前面的实践过程支撑。", "points": ["题目要求事例，不是名人论据或大段口号。", "可用困难作起点，但题目没有规定一定要失败，也没有规定梦想已经实现。", "重点连起来：情境 → 想到梦想 → 行动或变化 → 感受到的支持。"], "angles": [{"title": "把梦想变成当前的实践", "questions": "想当教师，现在能怎样练习教？讲给谁、何时讲、怎样准备？", "path": "梦想 → 主动学习 → 对应实践 → 收获", "example": "可先用「友達に問題を説明しました。」再补过程和自己的理解变化。"}, {"title": "梦想让自己主动尝试", "questions": "本来没有做的事，为什么愿意尝试？实际做了什么？", "path": "愿望 → 主动尝试 → 变化", "example": "可以写练习、向人请教或帮助朋友；不必编造成冠军。"}, {"title": "梦想支持长期坚持", "questions": "哪项小行动持续了？何时最难继续？梦想怎样支持？", "path": "日常行动 → 一次难点 → 继续 → 当前意义", "example": "可用「毎日少しずつ勉強しました。」但要补与梦想有关的心理转折。"}]}], "paragraphs": [{"name": "第一段", "theme": "梦想与现在", "purpose": "梦想是什么 → 为什么与自己有关 → 现在怎样准备", "content": ["介绍自己的梦想", "可补一句贴近自己的理由", "给出现在与梦想的联系"], "sentences": [{"role": "点明自己的梦想", "goal": "用一句清楚的话说明梦想是什么；大小不必比较。", "translation": "我的梦想是将来成为一名学校教师。", "steps": [{"question": "你希望将来做什么？先保留一个行动。", "hint": "Who＋What：我想成为教师。", "text": "私は先生になりたいです。", "note": "「先生になる」说变化的结果；「たい」表达自己的愿望。"}, {"question": "如果以“我的梦想是……”开头，主干怎样变？", "hint": "把“成为教师”用こと名词化。", "text": "私の夢は先生になることです。", "note": "从“我想”改成“我的梦想是”，不是把たい直接放进判断句。"}, {"question": "怎样限定时间与工作情境？", "hint": "When：将来；哪类教师：学校の先生。", "text": "私の夢は、将来、学校の先生になることです。", "note": "只补必要背景；不必堆职业名称、收入和地位。"}], "alternatives": [{"label": "基础表达", "text": "将来、学校の先生になりたいです。", "pattern": "Nになりたいです", "explanation": "直接写自己的愿望。", "difference": "不再用“我的梦想是”的判断结构，核心目标相同。"}, {"label": "基础表达", "text": "学校で勉強を教えたいです。", "pattern": "場所で／Vたいです", "explanation": "从具体工作内容切入。", "difference": "只写想做的事，不明确一定以教师为职业。"}, {"label": "中等表达", "text": "将来、先生になろうと思っています。", "pattern": "意向形＋と思っている", "explanation": "以目前持有的打算说明未来目标。", "difference": "愿望改成持续持有的意向，语气与结构均变化。"}], "original": "私の夢は、将来、学校の先生になることです。"}, {"role": "补一条贴近自己的缘由", "goal": "梦想可以联系自己喜欢的事情，不必补空泛口号。", "translation": "我喜欢给朋友讲解学习内容。", "steps": [{"question": "自己喜欢什么？", "hint": "先用こと把教学习内容这件事作喜好的对象。", "text": "勉強を教えることが好きです。", "note": "「Vことが好きです」说明喜欢做什么。"}, {"question": "可以补谁和教给谁吗？", "hint": "Who：我；对象：朋友。", "text": "私は、友達に勉強を教えることが好きです。", "note": "「友達に」是接受讲解的对象；喜欢教朋友与教师梦想有关，但不是说已经会教所有人。"}], "alternatives": [{"label": "基础表达", "text": "友達に勉強を教えたいです。", "pattern": "相手に／Vたいです", "explanation": "用意愿写想帮助朋友。", "difference": "喜欢已有活动改成想做某事，经历性质改变。"}, {"label": "基础表达", "text": "友達と勉強することが好きです。", "pattern": "相手と／Vことが好きです", "explanation": "从共同学习写兴趣。", "difference": "由教别人改成一起学习；理由侧重不同，不能当作完全等义。"}], "original": "私は、友達に勉強を教えることが好きです。"}, {"role": "交代现在的行动", "goal": "梦想与现在怎样联系？写一个正在做的日常行动。", "translation": "现在，我每天都在学校努力学习。", "steps": [{"question": "为了自己的未来，现在在做什么？", "hint": "先用简单动作句。", "text": "毎日勉強しています。", "note": "ている写日常持续行动；先不急着讲难事。"}, {"question": "怎样补地点、努力程度和当前时间？", "hint": "Where：学校；How：一生懸命；When：今。", "text": "今は毎日、学校で一生懸命勉強しています。", "note": "「で」表示动作场所。开头保持简短，重点事例留给下一段。"}], "alternatives": [{"label": "基础表达", "text": "今は毎日、一生懸命勉強します。", "pattern": "毎日＋Vます", "explanation": "描述通常行动。", "difference": "不用ている强调持续状态，频率仍清楚。"}, {"label": "基础表达", "text": "毎日の勉強を大切にしています。", "pattern": "Nを大切にする", "explanation": "概括重视学习的态度。", "difference": "由具体努力程度改成珍惜、重视；后文仍需实际行动。"}], "original": "今は毎日、学校で一生懸命勉強しています。"}], "branches": [{"title": "技能或兴趣上的梦想", "kind": "替换梦想", "questions": "最想学会什么？它为什么吸引你？现在在做哪件事？", "path": "愿望 → 兴趣 → 当前行动", "expression": "上手に泳ぎたいです。", "link": "换成游泳后，第二段要换成相应的害怕、练习与变化，不继续写数学。"}, {"title": "想读的学校或想学的领域", "kind": "替换梦想", "questions": "希望去哪里学习？为什么想学？眼前准备怎样做？", "path": "梦想 → 自己的理由 → 当前准备", "expression": "将来、大学で勉強したいです。", "link": "不要把大学层次或收入当作梦想大小的标准；事例写梦如何支持现在。"}], "cohesion_notes": ["前两句先把梦想与自己的兴趣连起来，第三句只作现在准备的过渡。", "本题明示要求简单介绍梦想，不要求完整交代职业规划或长篇起源。"], "original": "私の夢は、将来、学校の先生になることです。私は、友達に勉強を教えることが好きです。今は毎日、学校で一生懸命勉強しています。"}, {"name": "第二段", "theme": "学习与讲题相互促进", "purpose": "为梦想持续学习 → 休息时间讲题 → 调整讲法 → 自己理解加深 → 成绩进步", "content": ["每天学习为梦想准备", "休息时间主动给同学讲题", "讲不清时重新读书、调整解释", "讲题加深自己理解，成绩也提高", "教学体验加强教师梦想"], "sentences": [{"role": "让梦想引出持续学习", "goal": "先写成为教师的梦想促使自己怎样准备，再接讲题实践。", "translation": "为了梦想，我每天坚持复习。", "steps": [{"question": "为梦想准备时，每天具体做什么？", "hint": "先写持续复习，不用空泛的“努力”。", "text": "毎日復習を続けました。", "note": "「復習を続ける」是持续做的实际行动。"}, {"question": "怎样直接说明这件事与梦想有关？", "hint": "加Nのために表示目的。", "text": "夢のために、毎日復習を続けました。", "note": "把学习与梦想直接连起来；不是先写一次考试，再勉强补一句想起梦想。"}], "alternatives": [{"label": "基础表达", "text": "毎日、一生懸命勉強しました。", "pattern": "毎日＋Vました", "explanation": "用简单句写持续学习。", "difference": "只写行动，不明说梦想目的，前后要补联系。"}, {"label": "中等表达", "text": "先生になるために、毎日勉強しました。", "pattern": "Vために", "explanation": "把目的具体写为成为老师。", "difference": "将“为了梦想”明确化，意义接近，不要在上下文重复太多。"}], "original": "夢のために、毎日復習を続けました。"}, {"role": "把教师梦想变成讲题实践", "goal": "具体交代休息时间向同学讲题，这一行动直接呼应想当教师。", "translation": "并且，休息时我给朋友讲解数学题。", "steps": [{"question": "怎样先写出讲题动作？", "hint": "内容を説明する：说明一道题或问题。", "text": "数学の問題を説明しました。", "note": "「問題を説明する」写讲解题目，不等于只把答案告诉对方。"}, {"question": "讲给谁？", "hint": "接受说明的对象用に。", "text": "友達に数学の問題を説明しました。", "note": "主语承接我是讲题者；同学是听讲者。"}, {"question": "在什么时间做？怎样与学习连起来？", "hint": "When：休憩の時間には；用そして承接。", "text": "そして、休憩の時間には、友達に数学の問題を説明しました。", "note": "明确用户提出的休息时间讲题；不是已经以教师身份上课，而是在同学间实践教的行动。"}], "alternatives": [{"label": "基础表达", "text": "休憩の時間に、友達に数学を教えました。", "pattern": "时间に／相手にNを教える", "explanation": "用教える说同学间讲解。", "difference": "由数学题缩为数学，具体程度略低。"}, {"label": "基础表达", "text": "友達に問題を説明しました。", "pattern": "人にNを説明する", "explanation": "保留讲题对象和内容。", "difference": "省略休息时间与学科，需要由前文补足。"}], "original": "そして、休憩の時間には、友達に数学の問題を説明しました。"}, {"role": "提出讲解中的具体难点", "goal": "难点来自怎样教清楚，和教师梦想更贴近，不必另写考试受挫。", "translation": "起初，我还不能很好地解释。", "steps": [{"question": "讲题时可以遇到什么具体问题？", "hint": "先用可能否定写不能解释。", "text": "説明できませんでした。", "note": "説明する→説明できる；这里不是“不愿意”，而是能力还不足。"}, {"question": "怎样收敛为最初讲得不够好？", "hint": "加最初は与上手に，避免夸大成完全不会。", "text": "最初は上手に説明できませんでした。", "note": "不必虚构严重失败；小的讲解困难已经足以引出调整。"}], "alternatives": [{"label": "基础表达", "text": "最初は説明が難しかったです。", "pattern": "Aかったです", "explanation": "直接描述讲解当时的难度。", "difference": "由能力不足改成感到难，不完全相同。"}, {"label": "基础表达", "text": "最初は自信がありませんでした。", "pattern": "Nがありませんでした", "explanation": "换成心理困难。", "difference": "不直接说明讲得怎样；如果选这句，应另补行动上的调整。"}], "original": "最初は上手に説明できませんでした。"}, {"role": "为了讲清楚而重新学习", "goal": "写出讲题反过来促使自己更认真读书、整理方法的过程。", "translation": "于是，我认真阅读课本，思考解释的方法。", "steps": [{"question": "发现讲不清之后，先做什么？", "hint": "先写认真读课本。", "text": "教科書をよく読みました。", "note": "这是为了准备说明而学习，不是毫无来由的做题。"}, {"question": "读了以后还整理什么？", "hint": "用て形连接读书与思考，再加そこで。", "text": "そこで、教科書をよく読んで、説明の方法を考えました。", "note": "読む→読んで；讲不清→读课本→想怎样解释，形成与教有关的行动链。"}], "alternatives": [{"label": "基础表达", "text": "教科書をよく読みました。説明の方法も考えました。", "pattern": "短句＋も", "explanation": "拆开两个实际行动。", "difference": "信息基本一致，省略显式的そこで连接。"}, {"label": "中等表达", "text": "友達に説明するために、教科書を読みました。", "pattern": "Vために", "explanation": "明确读课本的目的。", "difference": "只保留读书，省略思考解释方式。"}], "original": "そこで、教科書をよく読んで、説明の方法を考えました。"}, {"role": "选择同学容易跟上的讲法", "goal": "用一个能看见的改进说明自己如何讲，而非只说认真帮助。", "translation": "我用简单的语言，一点点讲解。", "steps": [{"question": "怎么 ps": [{"question": "自己还有哪项可观察的进步？", "hint": "用よくなる写成绩改善。", "text": "自分の成績もよくなりました。", "note": "も突出帮助同学同时自己也有变化，不写具体分数或保证满分。"}, {"question": "怎样与前面持续学习的过程接起来？", "hint": "用て连接坚持与变化。", "text": "勉強を続けて、自分の成績もよくなりました。", "note": "前文已说明讲题促理解，这里再落到成绩；不把成绩提高说成唯一价值。"}], "alternatives": [{"label": "基础表达", "text": "自分の成績もよくなりました。", "pattern": "Aくなる", "explanation": "保留成绩变化的短句。", "difference": "原因由前文的学习与讲题承担，不再重复。"}, {"label": "中等表达", "text": "前より数学が分かるようになりました。", "pattern": "Vようになる", "explanation": "换成理解能力的变化。", "difference": "不再声称考试分数改善；如果采用，和前面的理解句要避免重复。"}], "original": "勉強を続けて、自分の成績もよくなりました。"}, {"role": "让事例回到教师梦想", "goal": "成绩提高之外，写自己更加喜欢教这件事，形成对梦想的反馈。", "translation": "我也比以前更喜欢教别人了。", "steps": [{"question": "实践之后，怎样看待“教”这件事？", "hint": "先用こと把动作作评价对象。", "text": "教えることが好きです。", "note": "不是只写自己考得好，而是回到梦想所指的教。"}, {"question": "经历让兴趣有了怎样的变化？", "hint": "加入前より，用好きになる写变化。", "text": "教えることが前より好きになりました。", "note": "从当前喜好改成经历后的变化；与想当教师的开头呼应。"}], "alternatives": [{"label": "基础表达", "text": "教えることは楽しかったです。", "pattern": "VことはAかったです", "explanation": "评价这次教的体验。", "difference": "不再强调比以前更喜欢，侧重当次经历。"}, {"label": "基础表达", "text": "これからも友達に教えたいです。", "pattern": "Vたいです", "explanation": "用以后继续的愿望写反馈。", "difference": "从过去兴趣改变转为未来意愿，可以与结尾合并避免重复。"}], "original": "教えることが前より好きになりました。"}], "branches": [{"title": "从一道题的讲解展开", "kind": "聚焦同一经历", "questions": "讲的是什么学科？最初哪里讲不清？怎样换个说法？自己因此明白了什么？", "path": "一处讲解难点 → 查书与整理 → 重新说明 → 双方理解", "expression": "友達に問題を説明しました。自分もよく分かりました。", "link": "可压缩其他日常活动，把字数留给讲题如何加深理解；不必虚构题号和分数。"}, {"title": "以帮助同学验证兴趣", "kind": "调整结果重点", "questions": "同学听懂后怎样回应？自己是否更愿意教？", "path": "主动讲解 → 同学回应 → 喜欢教的体验", "expression": "教えることは楽しかったです。", "link": "不一定写分数提升，也可用实际体验说明梦想怎样促成行动；但须有具体讲解过程。"}, {"title": "换成其他梦想的对应实践", "kind": "更换整条主线", "questions": "另一个梦想有哪些现在就能做的小实践？它怎样让自己进步？", "path": "梦想 → 对应实践 → 自己与他人的变化", "expression": "毎日少しずつ練習しました。", "link": "学生换梦想时，要换成与那个梦想直接相关的行动，不能所有梦想都套“讲数学题”。"}], "cohesion_notes": ["先明确为了梦想持续学习，再写休息时间向同学讲题：行动直接对应想当教师。", "讲不清→读课本想讲法→简单语言说明→自己理解加深，这几句解释了成绩改善的过程。", "结果既有自己的成绩变化，也有更喜欢教这件事；不能只保留成绩，丢掉教学实践。"], "original": "夢のために、毎日復習を続けました。そして、休憩の時間には、友達に数学の問題を説明しました。最初は上手に説明できませんでした。そこで、教科書をよく読んで、説明の方法を考えました。簡単な言葉で、少しずつ説明しました。友達に教えると、自分もよく理解できました。友達も私も、とてもうれしかったです。勉強を続けて、自分の成績もよくなりました。教えることが前より好きになりました。"}, {"name": "第三段", "theme": "梦想的当前意义", "purpose": "阶段进步与教师身份不同 → 梦想正在支持自己 → 继续学习与讲题", "content": ["尚未成为教师，但已做对应实践", "把学习与教的收获归为梦想的当前作用", "以后继续与梦想直接相关的行动"], "sentences": [{"role": "区分梦想与阶段结果", "goal": "承认梦想仍在未来，让结尾与学生现在的身份一致。", "translation": "我现在还没有成为教师。", "steps": [{"question": "眼前的进步是不是等于梦想已经实现？", "hint": "先写“还没有成为教师”。", "text": "まだ先生になっていません。", "note": "状态结果用なっていません，与以后想成为教师并不矛盾。"}, {"question": "怎样突出这一点？", "hint": "把先生加には作为对照话题。", "text": "今は、先生にはまだなっていません。", "note": "当前不是教师，而学习已有改善；不是否定梦想价值。"}], "alternatives": [{"label": "基础表达", "text": "今も、先生になることが私の夢です。", "pattern": "VことがNです", "explanation": "用肯定句说明梦想仍然存在。", "difference": "不直接说尚未实现，但保持未来目标一致。"}, {"label": "基础表达", "text": "これからも、先生になりたいです。", "pattern": "Vたいです", "explanation": "用持续愿望收束。", "difference": "省略眼前结果与长期梦想的区分，可与后句合并避免重复。"}], "original": "今は、先生にはまだなっていません。"}, {"role": "归纳梦想改变日常的作用", "goal": "根据学习与讲题的事例，归纳梦想怎样支持现在的自己。", "translation": "不过，梦想正在支持着现在的我。", "steps": [{"question": "自己的梦想如今起到什么作用？", "hint": "先用支える写支持。", "text": "夢は私を支えています。", "note": "这个判断由前面的行动与变化支持，不能单独代替事例。"}, {"question": "怎样接住尚未成为教师的现状？", "hint": "加しかし与今の。", "text": "しかし、夢は今の私を支えています。", "note": "梦尚未实现，但已经促成学习和讲题；不必把自己写成在职教师。"}], "alternatives": [{"label": "基础表达", "text": "夢があるので、毎日勉強を続けます。", "pattern": "ので原因", "explanation": "用原因关系说明学习动力。", "difference": "只概括持续学习，讲题的作用由前文保留。"}, {"label": "基础表达", "text": "夢のために、今も努力しています。", "pattern": "Nのために", "explanation": "用目的表达当前努力。", "difference": "从梦想支持我改成我为梦想努力，视角不同。"}], "original": "しかし、夢は今の私を支えています。"}, {"role": "写今后继续学习与教的意愿", "goal": "结尾保留讲题实践，使今后行动与教师梦想一致。", "translation": "今后，我也想继续给朋友讲解，接近自己的梦想。", "steps": [{"question": "今后还想坚持哪项实践？", "hint": "先写自己愿意继续教。", "text": "これからも友達に教えたいです。", "note": "たい是自己的愿望，不是要求同学必须听自己讲。"}, {"question": "怎样把实践的方向接回梦想？", "hint": "用て连接教与想接近梦想。", "text": "これからも、友達に教えて、夢に近づきたいです。", "note": "从继续做一件事补到为何做；前段已写持续学习，不必在结尾再罗列所有动作。"}], "alternatives": [{"label": "基础表达", "text": "これからも勉強と説明の練習を続けます。", "pattern": "NとN／V続ける", "explanation": "明确继续学习与练说明。", "difference": "愿望改成行为打算，省略接近梦想的表述。"}, {"label": "中等表达", "text": "夢のために、友達にも教えたいです。", "pattern": "Nのために／たい", "explanation": "用目的说明教学实践。", "difference": "不再写逐渐接近，保留自己行动的方向。"}], "original": "これからも、友達に教えて、夢に近づきたいです。"}], "branches": [{"title": "结果尚未理想，仍然坚持", "kind": "调整结果与结尾", "questions": "现在仍有什么困难？哪件行动还在继续？梦想怎样支持？", "path": "承认困难 → 持续行动 → 梦的当前意义", "expression": "今も毎日、練習を続けています。", "link": "本题没有要求最终成功；可以写仍在努力，不编造已经实现。"}, {"title": "以个人行动打算结束", "kind": "替换结尾", "questions": "明天或今后会继续做什么？与梦想有什么关系？", "path": "事例体会 → 一项打算", "expression": "これからも毎日勉強します。", "link": "不突然扩大到“所有人都能成功”，保持与个人事例一致。"}], "cohesion_notes": ["不能把给同学讲题写成自己已经成为学校教师。", "结尾概括梦想如何让自己更主动学习和帮助别人，不只说成绩高了。", "最后的继续讲题与开头喜欢教、想当教师首尾呼应。"], "original": "今は、先生にはまだなっていません。しかし、夢は今の私を支えています。これからも、友達に教えて、夢に近づきたいです。"}], "genre": {"name": "以具体事例说明梦想作用，结合叙事与感受", "summary": "简单介绍梦想后，用与梦想直接相关的实践说明作用。对教师梦想，可以写不断学习、给同学讲题及相互促进的收获。", "evidence": [{"requirement": "简单介绍你的梦想", "reason": "需要一个清楚的个人愿望或方向，开头不宜只讲所有人的梦想。"}, {"requirement": "以具体事例，说明梦想带给你的力量", "reason": "需要用具体行动或变化作证据，不能只罗列梦想好处。"}], "route": [{"step": "说清梦想", "question": "想成为什么样的人？现在能做什么准备？"}, {"step": "选择对应实践", "question": "哪件行动与这个梦想直接相关？"}, {"step": "写过程与收获", "question": "怎样学习、怎样实践？自己和别人有什么变化？"}, {"step": "归纳支持作用", "question": "梦想怎样改变日常行动，今后还想继续什么？"}], "tips": ["一种方案：梦想与准备—与梦想直接相关的实践—收获与今后行动。", "也可从一次想停止的瞬间开头，再交代梦想与后续行动；并非必须三段或必须受挫。", "重点用What和How，Why解释梦想与行动的关系；时间地点按需补。"], "pitfalls": ["只介绍理想职业，整篇没有事例。", "详细写一次考试或比赛，却没有说明梦想怎样参与。", "把朋友或老师替自己做事当作梦想的全部作用。", "为显得圆满，突然写梦想已经实现，与学生身份及前文矛盾。"], "qualification": "以上为根据题目要点作出的教学判断，不是官方唯一文体或评分条款。"}, "example_analysis": [{"title": "新例子怎样与梦想直接相连？", "body": "教师梦想→不断学习→休息时间给同学讲数学题。讲解不顺时重读课本、思考讲法，再用简单语言逐步解释。教同学也加深了自己的理解，持续学习后成绩改善，并更喜欢教。"}, {"title": "“梦想的力量”具体在哪里？", "body": "梦不是一次考试受挫后的泛泛鼓励，而是促成现在就能做的教学实践。学习帮助讲题，讲题又促进理解，带来自己进步，整条过程与想当教师有关。"}, {"title": "如何避免只写“帮助别人很快乐”？", "body": "保留“最初讲不清—重新读书想方法—讲清楚时自己也理解”的过程。既写同学受益，也写自己的理解和成绩提高；最后回到教师梦想。"}, {"title": "来源与适用边界", "body": "按用户本轮提出的方向重新构拟教学例文，不把叙事者“我”等同用户真实经历。学生换梦想后，实践内容与收获也应一起调整。题目没有规定梦想已经实现。"}, {"title": "字数与表达范围", "body": "修订后正文302字符，含标点、不含标题和空白，处于280～320字范围。15句中基础11句、中等4句。变式不计入正文；原稿纸占格需另按答题纸规则核对。"}], "errors": [{"title": "事例要与梦想直接相关", "q": "想当教师的梦想，哪类行动更能说明它的力量？", "wrong": "【联系偏弱】只写成绩不好后努力，未体现想教或帮助别人。", "right": "夢のために、毎日復習を続けました。\n休憩の時間に、友達に数学を教えました。", "why": "持续学习与讲题共同成为教师梦想的当前实践。还需说明讲题如何促进自己理解，不能只把“梦想”贴在泛泛学习故事上。"}, {"title": "成为：に／变化", "q": "“想成为老师”怎样接？", "wrong": "【语法错误】先生をなりたいです。", "right": "先生になりたいです。", "why": "なる的变化结果用に；たい表达自己的愿望。"}, {"title": "名词化：なること", "q": "“我的梦想是成为老师”怎样写完整判断？", "wrong": "【语法错误】私の夢は先生になりますです。", "right": "私の夢は先生になることです。", "why": "普通形なる＋こと作名词性内容，整句用です结束。"}, {"title": "ために：目的还是原因", "q": "“为了梦想复习”表达目的，还是事情已经发生的原因？", "wrong": "【理解错误】把本句夢のために直接解释为“因为梦想导致某结果”。", "right": "夢のために、毎日復習を続けました。", "why": "本句为个人目标而做准备，用目的关系。ために也有原因用法，需要按语境分别理解，不能只认形式。"}, {"title": "休息时间：に／には", "q": "休息时间讲题，时间怎样接到动作？", "wrong": "【助词误用】休憩の時間を、友達に説明しました。（想表达在休息时讲题）", "right": "休憩の時間に、友達に問題を説明しました。", "why": "本句时间用に；加は可突出与其他时间的对照。を应标说明的内容，不是动作发生时间。"}, {"title": "説明できる：能力表达", "q": "“最初讲得不够好”是能力不足，还是不愿讲？", "wrong": "【本意不同】上手に説明したくありませんでした。", "right": "最初は上手に説明できませんでした。", "why": "できる是可能，したい是否定意愿；两者不能只当不同活用互换。"}, {"title": "読む的て形", "q": "认真读课本后想讲法，読む怎样连接？", "wrong": "【活用错误】教科書を読んて、…", "right": "教科書をよく読んで、説明の方法を考えました。", "why": "読む→読んで，む结尾发生拨音便，不能写成読んて。"}, {"title": "给谁讲、讲什么", "q": "向同学讲题，哪个是对象、哪个是内容？", "wrong": "【助词混淆】友達を問題に説明しました。", "right": "友達に問題を説明しました。\n友達に数学を教えました。", "why": "同学是接受者，用に；题目或数学是内容，用を。自己讲解与老师替自己讲是不同事件。"}, {"title": "よい的变化", "q": "“成绩变好”怎样说？", "wrong": "【语法错误】成績がよいになりました。", "right": "成績がよくなりました。", "why": "い形容词よい→よく＋なる；敬体过去变化在なりました上。"}, {"title": "现在努力≠梦想已实现", "q": "成绩改善，就能写已经成为老师吗？", "wrong": "【逻辑跳跃】前文还是学生，一次考试后突然说先生になりました。", "right": "今は、先生にはまだなっていません。", "why": "阶段性进步可以证明梦想的当前作用，本题不要求梦想已实现。"}], "count": 302, "quality_review": {"criter ": "●健康のために、毎日運動している。\n●餃子を作るために、野菜や肉を買ってきた。", "sheet": "高中课标语法", "row": 40, "reference": "'高中课标语法'!A40:D40", "inherited_cells": {}}, {"serial": 89, "form": "Vようになる", "meaning": "表示某种状态的变化结果。", "example": "●三回だけ練習して、この歌が歌えるようになった。", "sheet": "高中课标语法", "row": 91, "reference": "'高中课标语法'!A91:D91", "inherited_cells": {}}, {"serial": 91, "form": "V(ら)れる", "meaning": "（1）在【NにVられる】被动态句式中，【Nに】是动作发出者，表示主语被【Nに】实施了该动作的意思。\n（2）在【NにNをVられる】被动态句式中，【Nに】是动作发出者，【Nを】是动作涉及物，表示主语被实施了该动作或受到该动作的影响，常含有受到损害的意思。\n（3）表示具备做某种动作的能力，或者具有某种可能性。\n（4）对听话人或话题中所涉人物表示尊重（尊他）。", "example": "●子どもの時はよく親に怒られていた。\n●バスに乗った時、知らない人に足を踏まれた。\n●この図書館の本はだれでも借りられる。\n●先生はもう帰られた。", "sheet": "高中课标语法", "row": 93, "reference": "'高中课标语法'!A93:D93", "inherited_cells": {}}, {"serial": 59, "form": "Vと", "meaning": "（1）时间复句。连接两个先后发生的事件。从主句为同一主体的动作时，表示连续动作；从主句为不同主体时，从句表示发现主句动作或者状态的时间点。\n（2）条件关系复句。从句表示条件，和主句构成反复性、规律性的条件关系。", "example": "●先生は教室に入ってくると、早速授業を始めた。\n●家へ帰ると、すぐ電話がかかってきた。\n●デパートへ行くと、チョコレートが山積みになっていた。\n●春になると、山には一面にきれいな花が咲く。\n●彼は酒を飲むと顔が赤くなる。", "sheet": "高中课标语法", "row": 61, "reference": "'高中课标语法'!A61:D61", "inherited_cells": {}}], "source_anomaly": "原词表ちから的汉字栏为カ，疑似力的异体/OCR问题；保留源数据，不把表中疑字当作正确日语示范。标题夢の力按题目原样保留，正文用頑張る、支える等表达其作用。", "actual_usage_review": "ために用于梦想的目的；説明できる是能力而非意愿；Vと用于经历中的发现；よくなる写成绩改善；こと名词化用于评价教；第15句たい表达自己的意愿。"}, "sentence_load": [{"index": 1, "text": "私の夢は、将来、学校の先生になることです。", "characters": 21, "level": "基础", "structures": ["こと名词化"], "structure_count": 1, "nesting_layers": 1, "reason": "教师梦想的内容。"}, {"index": 2, "text": "私は、友達に勉強を教えることが好きです。", "characters": 20, "level": "基础", "structures": ["Vことが好き"], "structure_count": 1, "nesting_layers": 1, "reason": "喜欢教与梦想有关。"}, {"index": 3, "text": "今は毎日、学校で一生懸命勉強しています。", "characters": 20, "level": "基础", "structures": ["ている持续"], "structure_count": 1, "nesting_layers": 0, "reason": "持续日常学习。"}, {"index": 4, "text": "夢のために、毎日復習を続けました。", "characters": 17, "level": "基础", "structures": ["Nのために目的"], "structure_count": 1, "nesting_layers": 0, "reason": "复习作为梦想准备，单一目的关系。"}, {"index": 5, "text": "そして、休憩の時間には、友達に数学の問題を説明しました。", "characters": 28, "level": "基础", "structures": [], "structure_count": 0, "nesting_layers": 0, "reason": "具体时间、接受对象与讲题动作。"}, {"index": 6, "text": "最初は上手に説明できませんでした。", "characters": 17, "level": "基础", "structures": ["可能否定"], "structure_count": 1, "nesting_layers": 0, "reason": "最初讲解能力不足，不另设考试失败。"}, {"index": 7, "text": "そこで、教科書をよく読んで、説明の方法を考えました。", "characters": 26, "level": "基础", "structures": ["て连接先后动作"], "structure_count": 1, "nesting_layers": 0, "reason": "读课本与思考讲法顺序清楚。"}, {"index": 8, "text": "簡単な言葉で、少しずつ説明しました。", "characters": 18, "level": "基础", "structures": ["少しずつ"], "structure_count": 1, "nesting_layers": 0, "reason": "讲解方式与节奏同属单一动作。"}, {"index": 9, "text": "友達に教えると、自分もよく理解できました。", "characters": 21, "level": "中等", "structures": ["Vと引出经历发现", "可能表达"], "structure_count": 2, "nesting_layers": 1, "reason": "教的过程与自己理解相联系，提供拆句写法。"}, {"index": 10, "text": "友達も私も、とてもうれしかったです。", "characters": 18, "level": "基础", "structures": [], "structure_count": 0, "nesting_layers": 0, "reason": "双方都高兴的简单情绪句。"}, {"index": 11, "text": "勉強を続けて、自分の成績もよくなりました。", "characters": 21, "level": "中等", "structures": ["て连接过程与结果", "よくなる变化"], "structure_count": 2, "nesting_layers": 0, "reason": "行动到自己的成绩改善，两个关系。"}, {"index": 12, "text": "教えることが前より好きになりました。", "characters": 18, "level": "中等", "structures": ["こと名词化", "好きになる变化"], "structure_count": 2, "nesting_layers": 1, "reason": "教这件事与兴趣变化相连，回扣梦想。"}, {"index": 13, "text": "今は、先生にはまだなっていません。", "characters": 17, "level": "基础", "structures": ["尚未变化的结果状态"], "structure_count": 1, "nesting_layers": 0, "reason": "仍是学生，非已成教师。"}, {"index": 14, "text": "しかし、夢は今の私を支えています。", "characters": 17, "level": "基础", "structures": ["ている持续状态"], "structure_count": 1, "nesting_layers": 0, "reason": "以支撑概括梦想当前作用。"}, {"index": 15, "text": "これからも、友達に教えて、夢に近づきたいです。", "characters": 23, "level": "中等", "structures": ["て连接行动", "たい个人愿望"], "structure_count": 2, "nesting_layers": 0, "reason": "把教与梦想方向连起来。"}], "review_passes": [{"focus": "用 'use strict';const D=JSON.parse(document.getElementById('lesson-data').textContent),app=document.getElementById('app');let view='task',point=-1,para=-1,si=0,error=0,showError=false,translation=false;const S=D.paragraphs.map(p=>p.sentences.map(()=>({step:0,hint:false,answer:false,note:false})));const names=[['task','01 题目与要点'],['map','02 全文框架'],['summary','03 完整导图'],['essay','04 范文'],['errors','05 难点与易错点']];const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;if((cls||'').split(' ').includes('jp')||text===D.title)e.lang='ja';return e};function add(parent,tag,cls,text){const e=el(tag,cls,text);parent.append(e);return e}function button(parent,text,fn,cls=''){const b=add(parent,'button',cls,text);b.onclick=fn;return b}function go(v){view=v;render();window.scrollTo(0,0)}function head(n,t){add(app,'div','eyebrow',n);add(app,'h1','',t)}function diff(parent,before,after){if(!before){parent.textContent=after;return}const a=Array.from(before),b=Array.from(after),dp=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));for(let i=a.length-1;i>=0;i--)for(let j=b.length-1;j>=0;j--)dp[i][j]=a[i]===b[j]?1+dp[i+1][j+1]:Math.max(dp[i+1][j],dp[i][j+1]);let i=0,j=0,run='';const flush=()=>{if(run){add(parent,'mark','',run);run=''}};while(j<b.length){if(i<a.length&&a[i]===b[j]){flush();parent.append(document.createTextNode(b[j]));i++;j++}else if(i<a.length&&dp[i+1][j]>dp[i][j+1]){i++}else{run+=b[j++];}}flush()}function styleInlineJapanese(){const terms=new Set(['です・ます体','てほしい','たい','な形容词','い形容词','便利になる','便利になりました','多い','多くて','親切で','駅の近くに','以前よりずっと','魅力だと思う','感じさせてくれる','便利にし']);terms.delete('な形容词');terms.delete('い形容词');const collect=v=>{if(typeof v==='string'){for(const m of v.matchAll(/「([^」]+)」/g))if(/[ぁ-ゖァ-ヺ]/.test(m[1]))terms.add(m[1]);}else if(Array.isArray(v))v.forEach(collect);else if(v&&typeof v==='object')Object.values(v).forEach(collect)};collect(D);D.errors.forEach(e=>[e.wrong,e.right].forEach(v=>v.split('\n').forEach(line=>{const x=line.includes('：')?line.slice(line.lastIndexOf('：')+1):line;if(/[ぁ-ゖァ-ヺ]/.test(x)&&!/[【】]/.test(x))terms.add(x)})));const list=[...terms].sort((a,b)=>b.length-a.length);const walker=document.createTreeWalker(app,NodeFilter.SHOW_TEXT),nodes=[];while(walker.nextNode())if(!walker.currentNode.parentElement.closest('[lang="ja"]'))nodes.push(walker.currentNode);for(const node of nodes){const text=node.textContent;let at=0,found=false;const frag=document.createDocumentFragment();while(at<text.length){let pos=text.length,term='';for(const x of list){const k=text.indexOf(x,at);if(k>=0&&k<pos){pos=k;term=x}}if(!term){frag.append(document.createTextNode(text.slice(at)));break}frag.append(document.createTextNode(text.slice(at,pos)));const span=document.createElement('span');span.lang='ja';span.textContent=term;frag.append(span);at=pos+term.length;found=true}if(found)node.replaceWith(frag)}}
function alternatives(parent,sentence,title='同一个意思，还可以怎样说？'){if(!sentence.alternatives?.length)return;const group=add(parent,'details','variants');add(group,'summary','',title);add(group,'p','muted','选择适合自己的一种表达；替换后再检查上下文与字数。');sentence.alternatives.forEach(v=>{const item=add(group,'section','variant');add(item,'h3','',v.label);add(item,'p','jp',v.text);add(item,'p','jp variantPattern',v.pattern);add(item,'p','',v.explanation);add(item,'p','muted','意思与语气：'+v.difference)});}
function render(){document.title=D.title;app.replaceChildren();const nav=document.getElementById('nav');nav.replaceChildren();names.forEach(([v,n])=>{const b=button(nav,n,()=>go(v),view===v||(view==='paragraph'&&v==='map')?'active':'');b.setAttribute('aria-current',view===v?'step':'false')});if(view==='task')task();if(view==='map'||view==='summary')map(view==='summary');if(view==='paragraph')paragraph();if(view==='essay')essay();if(view==='errors')errors();document.getElementById('status').textContent=view==='paragraph'?D.paragraphs[para].name+' · 第 '+(si+1)+' / '+D.paragraphs[para].sentences.length+' 句':names.find(x=>x[0]===view)[1];const bk=document.getElementById('back'),nx=document.getElementById('next');bk.disabled=view==='task';nx.disabled=view==='errors';nx.textContent=view==='map'?'进入段落带写 →':view==='paragraph'?'下一句 / 段 →':'下一步 →';bk.onclick=back;nx.onclick=next;styleInlineJapanese();requestAnimationFrame(draw)}
function genreIntro(parent){if(!D.genre)return;const g=D.genre,box=add(parent,'section','card genreIntro'),disclosure=add(box,'details');add(disclosure,'summary','','文章类型 · '+g.name);add(disclosure,'p','big',g.summary);add(disclosure,'h3','','为什么这样判断？');g.evidence.forEach(e=>{add(disclosure,'p','genreEvidence','题目要求：'+e.requirement+'\n我们需要：'+e.reason)});add(disclosure,'h3','space','我们可以沿着这条思路写');const route=add(disclosure,'div','genreRoute');g.route.forEach((r,i)=>{const item=add(route,'div','genreStep');add(item,'strong','',String(i+1).padStart(2,'0')+' · '+r.step);add(item,'p','',r.question)});add(disclosure,'h3','space','组织与启发');g.tips.forEach(x=>add(disclosure,'p','',x));const errors=add(disclosure,'details');add(errors,'summary','','这种写法要避免什么？');g.pitfalls.forEach(x=>add(errors,'p','',x));add(disclosure,'p','muted',g.qualification)}
function task(){head(D.section||'写作',D.title);add(app,'p','muted',D.translation);if(D.prompt)add(app,'p','promptText',D.prompt);const split=add(app,'div','taskStack space');genreIntro(split);const a=add(split,'section','card');add(a,'h2','','写作要点');const choices=add(a,'div','pointChoices');D.points.forEach((p,i)=>{const b=button(choices,'',()=>{point=i;render()},'point'+(point===i?' active':''));add(b,'small','',p.label);add(b,'span','',p.title)});if(point<0){add(split,'p','muted','点击上方要点，在下方展开写作思路。')}else{const p=D.points[point];const b=add(split,'section','card pointDetail');b.id='pointDetail';add(b,'span','pill',p.label+' · 教学解析');add(b,'h2','space',p.title);add(b,'p','big',p.detail);const ul=add(b,'ul','checks');p.points.forEach(x=>add(ul,'li','',x));(p.angles||[]).forEach(a=>{const box=add(b,'details');add(box,'summary','',a.title);add(box,'p','',a.questions);add(box,'p','','展开顺序：'+a.path);add(box,'p','',a.example)});}}function map(full){head(full?'回顾 · 内容如何连成一篇文章':'框架 · 点击段落展开',full?'把整篇文章连起来':'我们可以怎样组织全文？');const graph=add(app,'div','map');graph.id='graph';const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('aria-hidden','true');graph.append(svg);add(graph,'div','root',D.title).id='root';const bs=add(graph,'div','branches');D.paragraphs.forEach((p,i)=>{const col=add(bs,'div','branchbox');const b=full?add(col,'div','node'):button(col,'',()=>{para=i;render()},'node'+(para===i?' active':''));b.dataset.mapnode='1';add(b,'small','',p.name);add(b,'strong','',p.theme);add(b,'span','',p.purpose);if(full)p.sentences.forEach((l,j)=>{const c=add(col,'details','child mapSentence');const toggle=add(c,'summary','','第 '+(j+1)+' 句 · '+l.role);add(c,'p','jp mapExample',l.steps[l.steps.length-1].text);alternatives(c,l,'换一种句型表达')});});if(!full){const box=add(app,'section','card mapdetail');if(para<0){add(box,'p','placeholder','一种可选组织：先介绍梦想，再用具体事例说明它怎样影响行动，最后归纳支持作用。点击段落展开，也可从一次经历引入。')}else{const p=D.paragraphs[para];add(box,'h2','',p.name+' · 我们可以写什么');const chips=add(box,'div','contentchips');p.content.forEach(x=>add(chips,'span','',x));button(box,'放大进入这一段 →',()=>{si=0;go('paragraph')},'primary');}}else{const box=add(app,'div','card space');add(box,'p','big','教师梦想 → 持续学习 → 休息时间讲题 → 自己理解加深 → 成绩与兴趣变化 → 继续接近梦想。');add(box,'p','muted','点击每一句，展开对应例句；再次点击可收起。')}}
function draw(){const g=document.getElementById('graph');if(!g)return;const svg=g.querySelector('svg');svg.replaceChildren();const base=g.getBoundingClientRect(),root=document.getElementById('root').getBoundingClientRect();const x=root.left+root.width/2-base.left,y=root.bottom-base.top;g.querySelectorAll('[data-mapnode]').forEach(node=>{const r=node.getBoundingClientRect(),tx=r.left+r.width/2-base.left,ty=r.top-base.top;const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',`M${x},${y} C${x},${y+27} ${tx},${ty-27} ${tx},${ty}`);p.setAttribute('stroke','#a8b79d');p.setAttribute('stroke-width','2');p.setAttribute('fill','none');svg.append(p)})}
function paragraph(){const p=D.paragraphs[para],l=p.sentences[si],state=S[para][si],step=l.steps[state.step];const bar=add(app,'div','parahead');const title=add(bar,'div');add(title,'div','eyebrow',p.name+' · '+p.theme);add(title,'h1','',l.role);button(bar,'↖ 返回全文框架',()=>go('map'));add(app,'p','muted',p.purpose+'。下面选择一种可能写法练习，也可以换成自己的素材。');const layout=add(app,'div','sentenceLayout space');const side=add(layout,'aside','sentenceNav');p.sentences.forEach((v,i)=>{const b=button(side,'',()=>{si=i;render();window.scrollTo(0,0)},i===si?'active':'');add(b,'small','','第 '+(i+1)+' 句');add(b,'span','',v.role)});const main=add(layout,'section','card');add(main,'span','pill','这一句我们可以写什么');add(main,'p','big',l.goal);add(main,'p','tiny','从短句到完整表达 · '+(state.step+1)+' / '+l.steps.length);if(state.step){const prev=add(main,'div','previous');add(prev,'small','','前一步');add(prev,'span','',l.steps[state.step-1].text).lang='ja'}add(main,'div','question',step.question);const row=add(main,'div','row');button(row,state.hint?'收起提示':'启发提示',()=>{state.hint=!state.hint;render()});button(row,state.answer?'收起句子':'揭晓这一步',()=>{state.answer=!state.answer;render()},'primary');button(row,state.note?'收起讲解':'句式讲解',()=>{state.note=!state.note;render()});if(state.hint)add(main,'div','reveal',step.hint);if(state.answer){const a=add(main,'div','reveal jp');a.id='sentenceAnswer';diff(a,state.step?l.steps[state.step-1].text:'',step.text)}if(state.note)add(main,'div','reveal',step.note);const controls=add(main,'div','row space');const prev=button(controls,'← 前一步表达',()=>{state.step--;state.hint=state.answer=state.note=false;render()});prev.disabled=state.step===0;const more=button(controls,'继续拓展 →',()=>{state.step++;state.hint=state.answer=state.note=false;render()},'primary');more.disabled=state.step===l.steps.length-1;button(controls,'重置本句',()=>{S[para][si]={step:0,hint:false,answer:false,note:false};render()});if(state.step===l.steps.length-1&&state.answer)add(main,'p','muted','这是一个完整表达。也可以保留合适的短句，或换成自己的内容。');alternatives(main,l);const ext=add(app,'section','card space');const details=add(ext,'details');add(details,'summary','','其他角度：这一段还能怎样写？');p.branches.forEach(b=>{const d=add(details,'details');add(d,'summary','',b.title);add(d,'span','pill',b.kind);add(d,'p','','追问：'+b.questions);add(d,'p','','展开：'+b.path);add(d,'p','jp',b.expression);add(d,'p','',b.link)});const group=add(ext,'details');add(group,'summary','','连成段落：检查句序与衔接');add(group,'p','',p.purpose);(p.cohesion_notes||[]).forEach(x=>add(group,'p','',x));add(group,'p','','检查每一句是否服务本段主题；如果换了例子，后面的感受和结论也要跟着调整。');add(group,'p','','先把自己选的内容连成段落；完整范文留到后面再对照。')}
function essay(){head('范文 · 回看结构与表达',D.title);const controls=add(app,'div','row');button(controls,translation?'收起中文理解':'显示中文理解',()=>{translation=!translation;render()});add(controls,'span','muted',(D.essay_label||'教师提供范文')+' · 正文 '+D.count+' 字');const analysis=add(app,'section','card space');add(analysis,'h2','','现在看：例文选择了什么角度？');(D.example_analysis||[]).forEach(a=>{const item=add(analysis,'details');add(item,'summary','',a.title);add(item,'p','',a.body)});const box=add(app,'section','card essay space');D.paragraphs.forEach((p,i)=>{const sec=add(box,'div','essaypara');const row=add(sec,'div','row');add(row,'span','pill',p.name+' · '+p.theme);button(row,'回到逐句讲解',()=>{para=i;si=0;go('paragraph')});add(sec,'p','jp',p.original);if(translation)add(sec,'p','translation',p.sentences.map(l=>l.translation).join(''));});}
function errors(){head('分析 · 先判断，再看解释','难点与易错点');const layout=add(app,'div','errorlayout');const nav=add(layout,'aside','errnav');D.errors.forEach((v,i)=>button(nav,v.title,()=>{error=i;showError=false;render()},error===i?'active':''));const box=add(layout,'section','card'),e=D.errors[error];add(box,'span','pill',e.title);add(box,'div','question',e.q);button(box,showError?'收起解析':'查看辨析',()=>{showError=!showError;render()},'primary');if(showError){add(box,'div','reveal wrong','需要辨析\n'+e.wrong);add(box,'div','reveal right','正确表达或理解\n'+e.right);add(box,'p','big space',e.why)}add(box,'p','muted space','先保证内容完整、表达准确，再选择适合自己的句式。');const check=add(app,'details','card space');add(check,'summary','','写完后，回到题目检查');['梦想：说明自己想成为什么人或想做什么了吗？','事例：选了一件具体事，写清情境与行动了吗？','联系：梦想怎样促成想法或行动的改变？写出来了吗？','语言：当前学生身份、阶段进步与未来梦想是否一致？句末敬体是否统一？','字数：替换表达或补写以后，是否重新核对280～320字？'].forEach(x=>add(check,'p','',x))}
function next(){if(view==='task')go('map');else if(view==='map'){if(para<0)para=0;si=0;go('paragraph');}else if(view==='paragraph'){if(si<D.paragraphs[para].sentences.length-1){si++;render();window.scrollTo(0,0)}else if(para<D.paragraphs.length-1){para++;si=0;render();window.scrollTo(0,0)}else go('summary')}else if(view==='summary')go('essay');else if(view==='essay')go('errors')}
function back(){if(view==='paragraph'){if(si){si--;render()}else go('map')}else if(view==='map')go('task');else if(view==='summary')go('map');else if(view==='essay')go('summary');else if(view==='errors')go('essay')}
document.getElementById('size').onclick=()=>{document.body.classList.toggle('large');document.getElementById('size').textContent=document.body.classList.contains('large')?'标准字号':'大字';requestAnimationFrame(draw)};document.getElementById('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{document.getElementById('status').textContent='请使用浏览器自身的全屏功能。'}};window.addEventListener('resize',draw);document.addEventListener('keydown',e=>{if(e.target.isContentEditable||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();next()}if(e.key==='ArrowLeft'){e.preventDefault();back()}});render();
</script></body></html>
